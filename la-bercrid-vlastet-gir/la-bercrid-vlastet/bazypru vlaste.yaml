      multcu: |
      jbofu'ivlafavytsi: $x_1=t_1=t_3=fa_2=v_1=fu'ivla_1$ is a fu'ivla synonym variant meaning $x_2=v_2=fu'ivla_2$ based on lujvo/word $x_3=t_2=fa_3=fu'ivla_4$, with meaning understood by / to / dictionary $x_4=v_3=fu'ivla_3$.
