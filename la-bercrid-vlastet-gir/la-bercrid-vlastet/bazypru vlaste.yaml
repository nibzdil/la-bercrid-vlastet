        - valsi: bangere'use
          mifra: rus
          bangu cmene: Russian
        - valsi: bangara
          mifra: ara
          bangu cmene: Arabic
        - valsi: bangejepene
          mifra: jpn
          bangu cmene: Japanese
    - gugde'usa'iso: $x_1$ is the country United States of America identified by ISO 3166 code ‘USA’.
