          mifra: zho
          bangu cmene: Chinese
        - valsi: bange'enege
          mifra: eng
          bangu cmene: English
        - valsi: bangexu'ine
          mifra: hin
          bangu cmene: Hindi
        - valsi: bangesepa
          mifra: spa
