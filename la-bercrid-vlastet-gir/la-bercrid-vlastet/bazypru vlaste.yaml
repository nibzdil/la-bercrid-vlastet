    - bau'o: switch language (anonymous).
      selma'o: BAUhO
      notci: "Indicates the language is switched at this point in text to another language (possibly, however, just another dialect or even a simple change of grammar feature).  It is up to the new language to decide if, how, and when the language switches back.  {bau'o} itself does not specify what language is switched to (see notes in {zoi'o}).  Suggestion: «bau'o» means «jo'au zo'e».  See also: {jo'au} (switch language with COI grammar), {zoi'o} (quote and switch language), {lai'o} (name quote and switch language), and {me'ai'o} (selbri quote and switch language)."
      smuvelckivla: switch language;change language
      vlakra: zo bau joi zo fa'o
    - zoi'o: start a quote while changing to another language; «lu fu'oisa'a bau'o».
      selma'o: ZOIhO
      smuvelckivla: switched language quote;zoi'o, zoi without delimiters;zoi'o
      notci: |
        It is up to the switched-to language to determine when the language switches back after terminating, like caller-saved vs callee-saved registers in assembly (who is responsible for preserving a register's value?); or like an encoding that gives up control when switching to a nested encoding and leaves responsibility or the option to switch back, to the inner encoding; or like a jump call to code that promises to jump back to a given function pointer.  A parser would need to have as a dependency support for the inner language so it knows when to switch back, and it would need to know what language it was, possibly by being told or specified in another statement or by another mechanism, or being configured with a setting.

        ​

        ni'o This happens to also make it convenient to switch to a language such as ‘English with an implied terminator not explicitly expressed that is inferred by context that switches/pops back to the previous language’, enabling a ‘«zoi» without delimiters’, or alternatively a «zoi» with delimiters specified by the inner, internal language.  This can be a convenient way to shorten foreign quotes in regular speech, even if it involves a trade-off of more implicit languages used (although it can also be used with languages that have very explicit rules for managing language switches).  Part of the trade-off if used in non-logical languages is that the terminator is now the responsibility of the inner language, meaning an important part of the grammar now depends on the inner language's context and meaning-dependent grammar.  This can be avoided with explicit use of {zoi}.

        ​

        ni'o To specify what language is switched to, the inner coding can be chosen as and specified to be a small wrapper encoding that starts with the language (like a header) and then switches to it.

        ​

        ni'o {zoi'o} is followed by «.»; this permits other words starting with «zoi'o» to also exist without being turned into an immediate «zoi'o» application.

        ​

        ni'o Normally the inner/new language has the terminator, not the outer language.  However, if the new language is Lojban, {li'u} technically terminates {zoi'o}, and then {ju'au'u} switches back to the previous language (or you could merely terminate {zoi'o} but continue in the new language).  Additionally, {zoi'o} can be complemented with {jo'au'i} to add a stack manipulation rather than directly switching the current language like {bau'o}.

        ​

        ni'o See also: {bau'o} (switch language), {la'oi} (selbri quote and switch language), {me'ai'o} (selbri quote and switch language), {jo'au} (switch language with COI grammar), {} (change / jump back to previous language), {} (pop back to outer language).
    - lai'o: start a name quote while changing to another language.
      selma'o: ZOIhO
      notci: "This is {zoi'o} but for {la'o}.  It works as «la mezoi'o».  See the notes in {zoi'o} for the language-switch style of foreign quotes.  See also: {la'o}, {la'oi}."
      smuvelckivla: switched language name;zoi'o
    - me'ai'o: foreign quoted selbri while changing to another language.
      selma'o: MEhAIhO
      notci: "This is {zoi'o} but for selbri.  It works as «me'au la'e zoi'o».  See the notes in {zoi'o} for the language-switch style of foreign quotes.  See also: {me'a'o}, {me'oi}."
      smuvelckivla: switched language selbri;zoi'o
    - jo'au'u: Change / jump back to previous language; «jo'au lo prula'i».
      selma'o: BAUhO
      notci: "This shortcut jumps back to the previous language set by either {bau'o} or {jo'au}.  This is like ‘cd -’, not ‘popd’; like a jump and not a call in assembly.  (Technically two stacks can be maintained by other mechanisms.).  This might not be a commonly used feature, but like Identity, it allows {zoi'o} to switch back after being terminated by {li'u}.  See also: {jo'au'i} (push current language), {zoi'o} (quote and change language)."
      vlakra: zo jo'au joi zo purci
      smuvelckivla: previous language;switch to previous language
    - jo'au'i: duplicate top of the jo'au'i language stack.
      selma'o: JOhAUhI
      notci: "This obscure feature pushes the current language on the jo'au'i language stack, like a DUP on some RPN calculators.  {jo'au'inai} pops (removes) the language at the top of the stack.  Neither switches the language by themselves.  «jo'au'i jo'au …» is a call rather than switch to another language (like call vs jump in assembly), and «jo'au'inai jo'au lo galraipau» (if still in Lojban with a dialect that includes {jo'au'i}) pops back to the outer language.  {jo'au} sets (changes / mutates) the top of the stack; normally the top of the stack is the currently used language, so it is good practice to explicitly switch back to the top of the stack after it is done being manipulated.  See also: {bau'o} (language switch), {jo'au} (switch to language), {zoi'o} (quote and language switch).  Additionally, see also {jo'au'e} (shortcut to a push-call language switch (from «nenri»)), {jo'au'a} (shortcut to a pop back to outer language (from «bartu»))."
      vlakra: zo jo'au joi zo fukpi
      smuvelckivla: dup language;jo'au'i
    - jo'au'e: change to an inner language; «ju'au'i jo'au».
      selma'o: COI3
      notci: "See {jo'au'i} for information on this mechanism.  See also: {jo'au} (switch language to), {bau'o} (switch language)."
      vlakra: zo jo'au joi zo nenri
      smuvelckivla: to inner language;jo'au'i
    - jo'au'a: pop back to the outer language; «jo'au'inai jo'au lo galraipau».
      selma'o: BAUhO
      notci: "See {jo'au'i} for information on this mechanism.  See also: {zoi'o} (quote and language switch), {jo'au} (switch language to)."
      vlakra: zo jo'au joi zo bartu
      smuvelckivla: pop language;jo'au'i
