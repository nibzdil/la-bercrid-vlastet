    - tidyke'u: $x_1=k_1$ (event) is the instance/recurrence/repetition of $x_2=t_1$ [agent] reading $x_3=t_2$ [text] from surface/document/reading material $x_4=t_3$ for the $x_5=k_3$th time; $x_2$ re-reads $x_3$ from $x_4$.
