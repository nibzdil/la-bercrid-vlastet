    - ? pli'aje:
          selma'o: KOhA4
          notci: |
            {ni'o} Proposed experimental cmavo sequence: {vo'a'e}…{vo'u'e} is a variant of {vo'a}…{vo'u} and is the same except it is explicitly a pro-sumti for the current (innermost) bridi with the shortest possible scope (even in descriptions), rather than the outermost bridi, or the innermost / current full bridi, or with the bridi choice left vague.

            {ni'o} The {vo'a}…{vo'u} sequence's choice of bridi is ambiguous: it depends on which Lojban standard you use.  Under the CLL, it is the current bridi, meaning it is the same as the proposed cmavo sequence: {vo'a'e}…{vo'u'e}.  Under {la} {ma'oste} usage, it is the outermost bridi.  See also the English Lojban wiki's page titled ‘'''vo'a''' in the CLL and in the ma'oste’ for a discussion on this topic.

            {ni'o} Proposed secondary axis index semantics: Use e.g. {vo'a'e}{xi}{pi'e}{re} to refer to the second-innermost bridi.  Perhaps {vei}…{ve'o} can be used to nest groups if needed.  (Without {pi'e}, {vo'a'e} as usual if indexed with {xi} would just change what place it refers to, e.g. x6.) (Perhaps then {vo'a'e} would be shorthand for {vo'a}{xi}{pi'e}{ni'u}{pa} or {vo'a}{xi}{pi'e}{ro} under the {la} {ma'oste} language dialect, saving 5 syllables.)  Alternatively, use compound subscripts as described in CLL 18.17 e.g. {vo'a'e}{xi}{vei}{xo'e}{ce'o}{re}.

            {ni'o} Additional proposed experimental cmavo sequences: {vo'a'e}…{vo'u'e} selects bridi from the shortest possible scope, allowing for direct reflexives (even in descriptions) (suggested mneumonic: ‘'e’ as in ‘se’ for a reflexive pronomial verb in some languages), {vo'a'ei}…{vo'u'ei} selects bridi from the outermost bridi (suggested mneumonic: ‘'ei’ as in ‘nei’ (like ‘dei’) as an alternative to using {vo'a'ei}…{vo'u'ei} when combined with {lo} and SE), and {vo'a'e'i}…{vo'u'e'i} selects from the innermost / current full bridi (suggest mneumonic: adding an extra ‘'i’ looks similar to the outer-bridi-separator {i}, and also ‘e'i’ is in ‘se'i’ which is a rafsi of {sevzi}).  Finally, {vo'a'o'e}…{vo'a'o'e} could be defined for the variant of an unspecified bridi, as in {xi}{pi'e}{xo'e}.  Example: in {i} {mi} {krici} {lo}{du'u} {lo} {bende} {cu} {se} {xamgu} {lo} {djuno} {be} {fi} {vo'a}, the ‘'e’ variant (shortest) would mean that those who know themselves are good for the team, the ‘'ei’ variant (outermost) would mean that those who know the speaker are beneficial for the team, and the ‘'e'i’ variant would mean that those who know the team are good for it.
      :
      - vo'a'e: "pro-sumti: repeats 1st place of the innermost / current bridi with the stortest possible scope (even in descriptions)."
      - vo'e'e: "pro-sumti: repeats 2nd place of the innermost / current bridi with the stortest possible scope (even in descriptions)."
      - vo'i'e: "pro-sumti: repeats 3rd place of the innermost / current bridi with the stortest possible scope (even in descriptions)."
      - vo'o'e: "pro-sumti: repeats 4th place of the innermost / current bridi with the stortest possible scope (even in descriptions)."
      - vo'u'e: "pro-sumti: repeats 5th place of the innermost / current bridi with the stortest possible scope (even in descriptions)."
      - vo'a'ei: "pro-sumti: repeats 1st place of main / outermost bridi of this sentence."
      - vo'e'ei: "pro-sumti: repeats 2nd place of main / outermost bridi of this sentence."
      - vo'i'ei: "pro-sumti: repeats 3rd place of main / outermost bridi of this sentence."
      - vo'o'ei: "pro-sumti: repeats 4th place of main / outermost bridi of this sentence."
      - vo'u'ei: "pro-sumti: repeats 5th place of main / outermost bridi of this sentence."
      - vo'a'e'i: "pro-sumti: repeats 1st place of the innermost / current full bridi."
      - vo'e'e'i: "pro-sumti: repeats 2nd place of the innermost / current full bridi."
      - vo'i'e'i: "pro-sumti: repeats 5th place of the innermost / current full bridi."
      - vo'o'e'i: "pro-sumti: repeats 4th place of the innermost / current full bridi."
      - vo'u'e'i: "pro-sumti: repeats 5th place of innermost application selbri (even in descriptions)."
