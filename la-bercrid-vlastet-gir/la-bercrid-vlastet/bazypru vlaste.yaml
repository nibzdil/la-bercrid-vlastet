    - ci'o'ei: Convert arbitrary bridi to UI with the grammar of {sei} (deprecated in favor of «ui'ei»).
      selma'o: SEI
      notci: |
        Deprecated in favor of {ui'ei}, a more idiomatic choice of word when it is available.  This general mechanism facilitates more general bridging between simple bridi and a specific feature of Lojban grammar, aiding in providing for a more minimal grammar foundation.  {ci'o'ei} can convert to UI arbitrary bridi, allowing the creation of new attitudinals.  Example: «.i ci'o'ei gleki do snada .iji'a .ui».  «{ci'o'ei} broda» is a shorter version of «.{ui} {ma'o'ei} broda».

        ni'o See also {ma'o'ei} (generalized {ci'o'ei} that attaches to an arbitrary cmavo), {ki'ai} (sumti/cmevla to UI (similar grammar to that of {coi} rather than {sei})), {sa'ei} ({ki'ai} except for onomatopoeia), {tai'i} ({ki'ai} restricted to phenomimes), {ci'oi} ({ki'ai} restricted to psychomimes).
    - ma'o'ei: With meaning / function.  Take the cmavo preceding as the selma'o, and convert the arbitrary bridi following it to give it meaning or function.
      selma'o: SEI
      notci: |
        Nonce / generic cmavo creation for existing grammar.  This can be used to convert arbitrary meaning (or cmavo, represented in a bridi) to a desired selma'o.  This is {sei} specialized to changing the meaning of the cmavo or word preceding {ma'o'ei} while preserving its grammar.  (See also {ui'ei} for a specialization of {ma'o'ei} to UI.  See {ju'a'ei} likewise for UI2.)

        ni'o (See {ze'ei} for a similar word restricted to a single word only rather than general bridi to express semantics (and with opposite order, perhaps like tanru) to coin nonce cmavo without allocating new experimental forms.)

        ni'o This general mechanism facilitates more general bridging between simple bridi and a specific feature of Lojban grammar, aiding in providing for a more minimal grammar foundation.

        ni'o Example: «.i .ui ma'o'ei xajmi mi se snuti .i va'i .u'i .i ca'e zo .u'i se smuni lu« .ui ma'o'ei xajmi »li'u».
      vlakla: se krasi lo me zo ma'o be le'oi loka rafsi be'o joi zo sei
      smuvelckivla: nonce cmavo, nonce word
    - .ui'ei: Convert arbitrary bridi to UI with the grammar of {sei}.
      selma'o: UIhEI
      smuvelckivla: nonce UI;manual UI from bridi, nonce;UI
      notci: Converts bridis to UI; shorthand for «.ui {ma'o'ei}».  For a grammar closer to sumti rather than SEI, see also {ki'ai}, which uses COI2 rather than SEI, which can convert cmevla, selbri, and zoi quotes; this permits the shorter version of e.g. «ki'ai .xm. mi pensi» rather than e.g. «.ui'ei me la .xm. mi pensi».  For conversion to selbri, see {tai'i}.  See also {ju'a'ei} for nonce evidentials (e.g. «ju'a'ei simlu» for «si'au» (‘it seems …’)).  Note that after SEI, selbri auto-terminate with {se'u} once a sumti is found, unless it is attached with {be} or {bei} (or {bei'i}); however, {bei'e} may be used after a SEI cmavo to still apply the following sumti, with effectively automatic {bei'i} application.  For converting bridi to arbitrary existing grammar, see {ma'o'ei}.
    - lo'ei: generic / nonce «lo»-type constructor with the grammar of «lo SEI»; «lo mu'a'ei».
      selma'o: LOhEI
      notci: |
        To create a custom «lo», you can say «lo'ei ⟨bridi⟩ se'u broda».  See also: {ui'ei}, {ju'a'ei}, {ma'o'ei}, {lo'u'a}.  (Due to its location in the grammar, «lo'ei» often but not always needs an explicit «se'u» terminator, unlike many other «mu'a'ei» shorthands.)

        ni'o Note that in Lojban grammar, «sei ko'a ko'e broda ko'i» means «sei ko'a ko'e broda se'u ko'i».  To keep sumti after «broda» attached, use either «bei'e» or «be».
      smuvelckivla: nonce LO;manual LO from bridi, nonce;LO
      vlakra: zo lo joi zo sei
    - la'e'ei: generic / nonce «la'e»-type constructor with the grammar of «la'e SEI»; «la'e mu'a'ei».
      selma'o: LAhEhEI
      notci: |
        To create a custom sumti convertor / qualifier like «la'e», you can say «la'e'ei ⟨bridi⟩ ⟨sumti⟩».  See also: {ui'ei}, {ju'a'ei}, {ma'o'ei}.

        ni'o Note that in Lojban grammar, «sei ko'a ko'e broda ko'i» means «sei ko'a ko'e broda se'u ko'i».  To keep sumti after «broda» attached, use either «bei'e» or «be».
      smuvelckivla: nonce LAhE;manual LAhE from bridi, nonce;LAhE
      vlakra: zo la'e joi zo sei
    - karncau: $x_1=c_1=k_1$ is individual / separate from / not with $x_2=c_2=k_2$ in state/condition/enterprise $x_3=k_3$; $x_1$ is individual / alone / separate.
      smuvelckivla: each;individual, individual;separate, non-pluralistically;sumti, separate;from, with singular logic;sumti
      notci: "A fu'ivla synonym variant of {kancau}, specialized for the purpose of specifying individuality and application of singular logic with {lu'a'ei} and denying/excluding massness (see {loi}) for this sumti or, similarly, plurality and application of plural logic (or visa versa with {to'e} (or {no'e} for either singular or plural)).  «lu'a'ei karncau le prenu cu bevri le pipno» means ‘Each person individually carried the piano’, closer to pre-xorlo CLL {lo} - it may sound odd if the 3 persons carried the piano at the same time, since it was a statement with explicit individuality.  «{lu'a'au}» makes a sumti individualistic, and is equivalent to «{lu'a'ei} {karncau}».  For less rigorous shortcuts to express (non-)individuality, the modal {koi'au} can be used (e.g. «le {koi'au} prenu»), as well as {terle'o} to express ‘as individuals’ (see {le'oi} for more information on this idiom); {karncau} especially with {lu'a'ei} is meant to be fully explicit (alias: {lu'a'au}).  See also: {tolykarncau}, {norykarncau}.  Note: this word is a fu'ivla and not a lujvo in morphology, since ‘n’ would not be needed to hyphenate 2 rafsi ‘kar’ and ‘cau’."
    - lu'a'au: «lu'a'ei karncau»; each individual …
      selma'o: LAhE
      notci: "Shorthand for «{lu'a'ei} {karncau}»; the sumti are seen as individuals or separate (see also {le'oi}).  See also: {lu'o'au}."
      vlakra: zo lu'a'ei joi zo karncau
      smuvelckivla: each;separate individual, individually;each
    - lo'u'a: «lo» with a focus on truthfulness and non-groupness; old-style «lo».
      selma'o: LE
      notci: |
        A gadri/descriptor under this proposed model: since «lo» is generic, «le» can focus more on specificity, non-groupness, and on it being more of a description than the description necessarily being true (non-veridical rather than vague veridicalness and rather than veridical), and «lo'u'a» compared to «lo» focuses on non-groupness and truthfulness.  «lo'u'a» also adds non-setness (although the individual itself can be a set).  Suggestion: «lo» may still have connotations of «lo'u'a»; for a strictly pure «lo» consider using «zo'e noi», which can be individuals, masses, sets, and novel types of sumti.  See also: «ma'o'ei», xorlo language mod, and «karncau» and related conveniences with LAhE, BAI, and other grammar for ‘each’ / individuality focus.

        ni'o Example: if a person, who is sitting inside a room, is in the middle of a room's walls (or a point in the middle of a square's four corners ({kurfa})), then while «lo prenu cu midju lo bitmu pe le kumfa» may be technically true, its connotation is false, since there may be greater emphasis on the person being actually inside of the walls, whereas «zo'e noi bitmu pe la kumfa» avoids that connotation, and «lo prenu cu midju lo'u'a bitmu pe le kumfa» means the person is inside each wall / a wall.  «lo prenu cu midju loi bitmu pe le kumfa» or «lo prenu cu midju lo gunma be lo bitmu pe le kumfa» may be more precise, as the object being discussed is the whole group of walls, perhaps as a certain type of group in terms of how it is used or interpreted, as in «lo prenu cu midju lo girzu be lo bitmu pe le kumfa sekai loka marji stuzi», so using a mass to signal alternative logic can be used to express this.  However, under this interpretation of individuality, to use the LLG CLL's example, three people carrying a piano implies each person was carrying the piano, even if the individuals happened to be in relation to each other, or even if they happened to be carrying the piano at the same time, so «lo'u'a» can be used here while still being true (see also {sepli} to communicate separate carrying, and {krefu} and {kei'u} (e.g. «kei'u lo sepli») to talk about the instances / whether it was at the same time, or {kancau} to communicate carrying alone, or {karncau} to use an alternative interpretation of individuality, one that has a stronger focus on separateness).
      vlakra: se krasi zo lo joi zo lu'a
      smuvelckivla: individuals that really are, old lo;old-style lo
    - kei'u: krefu modal, 1st place (in instance / at time); in instance / case …
      selma'o: BAI
      notci: "Example: «lo prenu be kei'u lo sepli cu bevri le pipno» means the people, at separate times, carried the piano.  «lo prenu be kei'u lo mintu cu bevri le pipno» means the people carried the piano at the same time / in the same instance.  See also: {lo'u'a}, {ke'u}."
      multcu: "smuvelckivla: in instance, in case;in instance, at time;in instance, again"
    - sekei'u: krefu modal, 2nd place; an instance of …
      selma'o: BAI*
      smuvelckivla: an instance of
    - tekei'u: krefu modal, 3rd place; for the …'th time
      selma'o: BAI*
    - ma'orfa'o: $x_1=f_1$ is a terminator of cmavo $x_2=f_2=c_1$ of selma'o $x_3=c_2$ (of $x_2$) of selma'o $x_4$ (of $x_1$) (with cmavo meaning/function $x_5=c_3$ (of $x_2$) in usage (language) $x_6=c_4$ (of $x_2$)).
      smuvelckivla: terminator;of a cmavo/selma'o.
      notci: "See alse: {famyma'o} (termating cmavo that has selma'o …)"
    - xu'ai: "evidential: I declare - I submit; «ju'a'ei ri'arxu'a»"
      notci: |
        As in a causal declaration.  Also ‘let’ as in ‘let there be’.  A shorter version of {ju'a} {ma'o'ei} {ri'arxu'a} (or {ju'a'ei} {ri'arxu'a}).

        ni'o See also {ca'e} (I define - I conform (proposed «nai» interpretation)), {ri'arxu'a} (declare), {si'au} (it seems; as in {ju'a} {ma'o'ei} {simlu}).
      vlakra: zo ri'arxu'a
      smuvelckivla: let;let there be, I declare;evidential
    - xu'ainai: "evidential: I declare - I submit; «ju'a'ei ri'arxu'a»"
      notci: |
        As in a causal declaration.  Also ‘let’ as in ‘let there be’.  A shorter version of {ju'a} {ma'o'ei} {ri'arxu'a} (or {ju'a'ei} {ri'arxu'a}).

        ni'o See also {ca'e} (I define - I conform (proposed «nai» interpretation)), {ri'arxu'a} (declare), {si'au} (it seems; as in {ju'a} {ma'o'ei} {simlu}).
      vlakra: zo ri'arxu'a
      smuvelckivla: I submit;evidential
    - ri'arxu'a: $x_1=xu_1$ declares/specifies $x_2=xu_2=r_1$ causing $x_3=r_2$.
      smuvelckivla: declare;causal declaration, specify;declare
      notci: "The gismu {xusra} is broader than just declarations.  This definition is meant to narrow down or modify {xusra} for a more declarative, active, authoritative sense, e.g. as in xusra's ‘[can be used for epistemology of authority]’, rather than mere claims or witnesses.  See also: {zgaxu'a} (claim), {xu'ai} (I declare), {xu'asmu} (define), {ki'irxu'a} (assign / designate), {te'iski} (synonym), {tinbe} (obey / conform), {javni}, {catni}, {ponse}."
    - zgaxu'a: $x_1=xu_1=z_1$ claims/asserts/states/witnesses/deduces/infers/[observes]/testifies/bears witness that $x_2=xu_2=z_2$ using senses/means $x_3=z_3$ under conditions $x_4=z_4$ conforming to $x_5$ (e.g. objective reality, epistimology, logical source, standard, subjective source).
      smuvelckivla: claim (deductive, inductive, or observational), assert (claim), state (claim), witness;claim, bear witness;claim, testify;cleam
      notci: "The gismu {xusra} is broader than just claims.  This definition is meant to take the more responsive or passive sense of the concept.  See also: {ri'arxu'a} (declare)."
    - po'ecru: $x_1=c_1=p_1$ consents to / licenses / gives permission / consent for $x_2=c_2=p_2$ under conditions / terms $x_3=c_3$ under property rights standard / law / custom / system of private exclusion / system of negative rights / system of rights $x_4=p_3$; $x_1$ consents to / gives license for $x_2$.
      smuvelckivla: consent;permission, license;consent, permit;ownership
    - multcu: "du lo bazypru: jai'ei: generic / nonce «la'e»-type constructor with the grammar of «jai SEI»; «jai mu'a'ei»."
      selma'o: JAIhEI
      notci: |
        With enough {jai} variants, it might be convenient to allocate a shorthand for «jai mu'a'ei».

        ni'o See also: {ui'ei}, {ju'a'ei}, {ma'o'ei}.

        ni'o Note that in Lojban grammar, «sei ko'a ko'e broda ko'i» means «sei ko'a ko'e broda se'u ko'i».  To keep sumti after «broda» attached, use either «bei'e» or «be».
      smuvelckivla: nonce JAI;manual JAI from bridi, nonce;JAI
      vlakra: zo la'e joi zo sei
    - multcu: "du lo bazypru: je'ei: generic / nonce «la'e»-type constructor with the grammar of «la'e SEI»; «je mu'a'ei»."
      selma'o: JEhEI
      notci: |
        To create a custom logical connective like «je», you can say «je'ei ⟨bridi⟩ ⟨sumti⟩».  See also: {ui'ei}, {ju'a'ei}, {ma'o'ei}.

        ni'o Note that in Lojban grammar, «sei ko'a ko'e broda ko'i» means «sei ko'a ko'e broda se'u ko'i».  To keep sumti after «broda» attached, use either «bei'e» or «be».
      smuvelckivla: nonce JA;manual JA from bridi, nonce;JA
      vlakra: zo la'e joi zo sei
    - plipu'ija'e: $x_1=j_1=pu_1=pi_1=pi_3$ is the result / output of application of [function]/[selbri] $x_2=j_2=pu_2=pi_2$ to [input]/[sumti]/[application]/[termset] $x_3=pu_3$.
      notci: |
        For agentive application / applying, consider using {gau} or adding a suffix of {gau} to prepend an x1 agent place.

        ni'o Contraction: {pli'aje}.
      smuvelckivla: application;functional, from application of;functional
    - pli'aje: $x_1$ is the result / output of application of [function]/[selbri] $x_2$ to [input]/[sumti]/[application]/[termset] $x_3$.
      notci: Contraction of {plipu'ija'e}.
      smuvelckivla: application;functional, from application of;functional
    - bei'i: "hybrid {be} and {bei}: sumti link to attached sumti to a selbri, repeatable, valid for both first and subsequent attachments.  Can also appear immediately after gadri like {lo}."
      selma'o: BEIhI
      notci: |
        {be} is only for the first attachment, and {bei} is only for non-first attachments.  {bei'i} is valid for either the first or subsequent attachments, and is terminated with {be'o}.  See also {bei'e}, to automatically apply {bei'i} to all following sumti until terminated with {be'o}; this also can be used after SEI cmavo to attach following sumti to the SEI cmavo without having to explicitly use {be} or {bei} to sumti that occur after the selbri (sumti preceding the selbri in the case of {sei} are already part of the SEI clause).

        ni'o {bei'i} additionally can add a link immediately after a gadri like {lo} before the description, with the result being as though the links were concatenated.  e.g. «lo bei'i ko'a [be'o] broda be ko'e bei bai ko'i [be'o]» means «lo broda be ko'a bei ko'e bei bai ko'i».  Experimental grammar mod: {be} also supports this function.
      smuvelckivla: link first or subsequent sumti;link sumti to selbri, gadri early link
    - joi'ei: generic / nonce «joi»-type constructor with the grammar of «joi'ei SEI»; «joi mu'a'ei».
      selma'o: JOIhEI
      notci: |
        To create a custom non-logical connective like «joi», you can say «joi'ei ⟨bridi⟩ ⟨sumti⟩».  See also: {ui'ei} (nonce UI), {ju'a'ei} (nonce evidential), {ma'o'ei} (nonce cmavo), {joi'u'i} (merge sumti).

        ni'o Note that in Lojban grammar, «sei ko'a ko'e broda ko'i» means «sei ko'a ko'e broda se'u ko'i».  To keep sumti after «broda» attached, use either «bei'e» or «be».
      smuvelckivla: nonce JOI;manual JOI from bridi, nonce;JOI
    - multcu: lonu jmina lo notci zo'ei zo joi'u'i sema'ai lodu'u ny notci cylyly panopiremu
    - joi'u'i: merge sumti into a single sumti / apply termset to manipulator; split place.
      selma'o: JOIhUhI
      notci: "Terminated by «nu'u».  «joi'u'i» starts a termset and has 3 forms: 1) «joi'u'i ko'a ko'e ko'i … [nu'u]» means «ko'a joi ko'e joi ko'i» (the termset can be empty; {nu'u} terminates).  2) «joi'u'i ce ko'a ko'e ko'i … [nu'u]» means «ko'a ce ko'e ce ko'i».  3) «joi'u'i broda ko'a ko'e ko'i … [nu'u]» means apply the termset «broda», which can be a custom function or handler ({me} can raise a sumti for this use); and similarly «joi'u'i be fo'a [be'o] ko'a ko'e ko'i … [nu'u]» means «joi'u'i me fo'a ko'a ko'e ko'i … [nu'u]» (you can also use {bei'i}).  See also {pi'a'e} (converse of {joi'u'i}), {ce'ei} («joi'u'i ce»), {joi'ei} («joi mu'a'ei»), {plipu'ija'e} (‘from application of’)."
      smuvelckivla: merge sumti, merge termset;merge sumti, apply termset to manipulator, split place
      vlakra: joi'u'i zo joi zo nu'i
    - pi'a'e: fill multiple places from a single sumti representation; splat sumti.
      selma'o: PIhAhE
      smuvelckivla: splat sumti;splat single sumti
      vlakra: zo pli'aje
      notci: "Similar grammar to {la'e}, but can fill zero or more places.  To specify a custom applier or application function fo'a to ko'a, you can use «pi'a'e be fo'a [be'o] ko'a», «pi'a'e bei'i fo'a [be'o] ko'a», and «pi'a'e me fo'a [me'u] ko'a».  See also: {joi'u'i} (merge sumti), e.g. «broda pi'a'e joi'u'i ce'o ko'a ko'e ko'i» (as in «broda ko'a ko'e ko'i»), however alternative representations, of different types, of possibly tagged terms are possible.  {fa'u'i} is {pi'a'e} but as FA rather than like LAhE, a subtle distinction."
    - fa'u'i: "sumti place tag: apply arbitrary sumti application or termset"
      selma'o: FA
      sumti place tag: apply arbitrary sumti application or termset
      notci: |
        This is {pi'a'e} (see {joi'u'i} and {pi'a'e}) but as FA rather than like LAhE, a subtle distinction.

        ni'o One use is to apply a termset bundled as a single sumti (e.g. with {joi'u'i}, {sumpoi}, {lo}{du'u}, or another mechanism).  Additionally, the sumti following {fa'u'i} can also include in its bundle an alternative method of how the (rest of the) sumti is meant to be applied (optionally with brevity with {ju'e}, {joi}, {ju'e}{ma'o'ei}, or a bridi).  How the application is done can be specified metalinguistically (see also {baunpli}), separately, or as metadata inside the sumti.

        ni'o See also: {lo'oi}, for one possible way to analogize {se} for {fa'u'i}; {pli'aje}.

        ni'o Etymology: {fa} and {nu'i}.  Note that {joi'u'i} builds a composite sumti like a termset, and {fa'u'i} applies it.  {fa'u'i} is a little less regular in its word formation since whereas {joi'u'i} might be seen as signalling the start of a termset, {fa'u'i} doesn't, but instead applies a termset.
      vlakra: zo fa joi zo nu'i
    - ~~~multcu: zo fa'u'i
