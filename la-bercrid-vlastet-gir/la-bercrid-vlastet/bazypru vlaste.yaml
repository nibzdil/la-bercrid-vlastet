    - na'o'e: vague/elliptical truth value for selbri; whether {ja'a}, {na}, etc. is applied is unspecified.

      notci: "See also: {ja'a}, {na}, {na'e'o'e} (for {na'e}), {cau'a} (alternative synonym), {xu'o'e} (alternative synonym)."
    - na'e'o'e: vague/elliptical truth value for sumti; whether {je'a}, {na'e}, etc. is applied is unspecified.

      notci: "See also: {je'a}, {na'e}, {na'o'e} (for {na}), {cau'e} (alternative synonym), {cau'o'e} (alternative synonym)."

    - tcinyza'i: $x_1=z_1=t_2$ (e.g. abstraction, energy) is potential / potentially real, made real when / under conditions $x_2=t_1$ for $x_3=z_2$ under metaphysics / conceptual framework / model $x_4=z_3$.
      multcu: |
        potential;realizable
        realizable;situationally real
        Example 1: .i le cerda poi pu'o ponse cu ca ponse .i ka'e go'i .ije na ca'a go'i .i va'i le cerda cu ca ponse le'oi loka tcinyza'i
        Example 2: .i le bolci noi se falgau fo teka'a lo galtu cu ckaji tu'alo tcinyza'i nejni
        Example 3: .i lonu mi snada cu tcinyza'i .i mi nitcu lonu cuxna zo'epoi mi certu co no'a

        See also: {ke'a}.

    - multcu: "lo multcu zo'u: very briefly thought of samca'adatni; give it some better thinking through and consider if you want a different word, and then provide a good-quality definition. software"
    - fu'oi: indicates attachment of the following to the next instead of, as normal, previous construct.
      selma'o: UI9
      notci: Place before UI to indicate it applies to the next construct rather than the previous.  See also {fu'e}…{fu'o}, {to}…{toi}, {tu'e'ei}…{tu'u'o}.
    - pe'au: marks a construct as having approximate meaning or likely improveable expression and/or as [offhand] the currently best known way to express meaning.
      selma'o: UI3c
      notci: "When the speaker is not aware of a way to precisely express meaning to their satisfaction, this can be used to pick a closest expression and indicate the meaning is slightly different or possibly improveable, until a precise or satisfactory construct is discovered.  Similar to {sa'enai}, but intended to indicate a possibly specific alternative meaning rather than vagueness or looseness in precision, although {sa'enai} might also work in some cases.  Example: «mi djica lo sa'enai djacu» might be used when what you want is water and/or alternatives that are close enough, like other hydrating drinks.  «mi djica lo pe'au djacu» might be used when you want something specific that is like water, perhaps a specific water-like substance, or you have some intended means of sumti qualification in mind, but since you haven't learned a good word or expression for it yet, you want to use «lo djacu» while also indicating that it's currently just the best way you know how to express it, especially when you expect that a more advanced understanding of vocabulary or topic would allow you to phrase it better differently, although the vagueness and semantic broadness in a gismu might sometimes be sufficient to adequately capture the meaning.  See also: {le}, {pe'ai}."
      smuvelckivla: approximate meaning, or something;or something like that
      vlakra: zo pe'a joi zo claxu (to claxu loka satci toi)
    - pe'aunai: marks a construct as expressing the intended meaning to the speaker's satisfaction.
      selma'o: UI3c*
    - pagjdicu'a: $x_1=c_1=j_1=p_1$ votes for [ranked choice / top] $x_2=c_2=j_2$ in poll/decision/election $x_3=j_3$ among options/alternatives $x_4=c_3$ among voters $x_5=p_2$.
      notci: For non-instant-runoff, single-choice-only votes, a ‘vote in strategy’ («pagjdicu'a le'oi loka kanpyvampla») can be expressed to express a vote for something in strategy rather than the direct ({setsta}), actual ({fatci}) vote, e.g. in the case of a spoiler vote.
      smuvelckivla: vote;partial decision selection
      stuzi smuvelckivla: voter;one who votes; vote;elected choice, election;voting
    - vampla: $x_1=p_1$ strategizes strategy $x_2=p_2$ for [composite/whole] goal(s) $x_3=p_3$, assigning value/worth $x_4=v_1$ to $x_5=v_2$ by judge(s) $x_6=v_3$ for [individual] goal(s)/use(s)/appreciation(s) $x_7=v_4$.
      notci: Shortened version of {kanpyvampla}, which is more a complete word for ‘strategy’ and more recommended.  See also {kanpe}.
    - kanpyvampla: $x_1=p_1$ strategizes strategy $x_2=p_2$ for [composite/whole] goal(s) $x_3=p_3$, assigning value/worth $x_4=v_1$ to $x_5=v_2$ by judge(s) $x_6=v_3$ for [individual] goal(s)/use(s)/appreciation(s) $x_7=v_4$, with predictors $x_8=k_1$ judging the probability/odds/likelihood of $x_9=k_2$ as $x_{10}=k_3$.
      smuvelckivla: strategy;value plan
      notci: "This word captures the essence of strategy: a value/goal plan with probability theory.  A shortened version of this word is {vampla}, but {kanpyvampla} is more complete and more recommended.  For more immediate, short-term, or static tactics, see {velva'itadji}."
    - velva'itadji: $x_1=t_1=v_2$ is a tactic / technique for accomplishing $x_2=t_2=v_4$ under conditions $x_3=t_3$, with value / usefulness $x_4=t_1$ to $x_5=t_3$.
      smuvelckivla: tactic;technique
      notci: See also {kanpyvampla} (‘strategy’).
    - dibyxau: $x_1=xa_1=d_1$ is high-quality / splendid / [superb] / [excellent] to $x_2=xa_2=d_2$ by standard $x_3=xa_3$.
      notci: "See also: {splurtakni}, {zabna}, {dirba}, {xamgu}, {banli}, {melbi}, {kukte}."
      smuvelckivla: quality;high quality, splendid;quality
    - splurtakni: $x_1$ is splendid to $x_2$ by standard $x_3$.
      notci: "See also: {mleba'i}, {dibyxau}."
      smuvelckivla: splendid;excellent
      vlakra: macnu se krasi lo vrici bangu
    - gundu'a: $x_1=d_1=g_1$ contributes work $x_2=d_2=g_2$ for value/goal/use/objective $x_3=g_3$ to [receiver]/[project] $x_4=d_3$.
      smuvelckivla: contribute;give a work
      stuzi smuvelckivla: contributor;giver of a work, contribution;a work given
    - do'o'e: with a vague / ommitted / elliptical / unspecified / [possibly alternative] place structure.
      selma'o: SE
      notci: "More general than {se'o'e}.  See also: {jai'a'a}, {co'au}, {co'e'o}."
      smuvelckivla: elliptical place structure conversion
    - co'au: change place structure basis of a tanru to the left unit (repeatable).
      selma'o: SE
      tolci'o:
        notci: Somewhat similar to {co'ai} but as SE rather than COhAI (like a FA, which is also sticky); {co'au} affects the tanru and always picks a seltau or tertau .  Recommended with experimental grammar feature that allows «SEku» in places other than before a brivla, since then you can say e.g. «carmi cidja co'auku loka titla», allowing «co'auku» to appear after the tanru is already said, when a speaker might possibly want to attach sumti to an already, previously spoken seltau.  Under LLG CLL Lojban, by default the tertau is used to select the place structure basis, even if {co} is used (12.2, 5.8) (e.g., «cidja coke carmi be loka titla» is not equivalent to «cidja co carmi loka titla», which might require a more poetic interpretation).  A second experimental grammar feature would permit «SEnai» to inverse {co'au}.  Just as for {se}, beware that {co'au} actually attaches to the tanru, e.g. as in «co'auke broda brode» rather than «co'au broda brode», just as for «seke broda brode» (as in «broda se brode»).  See also {co'e'o} (merges the seltau and tertau place structures; SE grammar), {co'ai} (new grammar to apply to the remaining attached sumti), {se'o'e} (SE grammar), {do'o'e} (indicates the place structure is vague/elliptical; SE grammar), {to'o'e}…{toi} (more general attachment or application to an unspecified component or point in text).
      tolci'o:
        notci: Somewhat similar to {co'ai} but as SE rather than COhAI ({co'ai} is like a FA, which is also sticky); {co'au} affects the attached tanru and always picks a seltau or tertau overriding any {co} that is inside, but {co} outside can still have its sumti-filling effect.  Recommended with experimental grammar feature that allows «SEku» in places other than before a brivla, since then you can say e.g. «carmi cidja co'auku loka titla», allowing «co'auku» to appear after the tanru is already said, when a speaker might possibly want to attach sumti to an already, previously spoken seltau.  Under LLG CLL Lojban, by default the tertau is used to select the place structure basis, but if {co} is used, the seltau is (12.2, 5.8).  A second experimental grammar feature would permit «SEnai» to inverse {co'au}.  Just as for {se}, beware that {co'au} actually attaches to the tanru, e.g. as in «co'auke broda brode» rather than «co'au broda brode», just as for «seke broda brode» (as in «broda se brode»).  See also {co'e'o} (merges the seltau and tertau place structures; SE grammar), {co'ai} (like FA that applies to the remaining attached sumti; but works more like an inverse of {co}'s place structure basis effect rather than specifically choosing the seltau or tertau), {se'o'e} (SE grammar), {do'o'e} (indicates the place structure is vague/elliptical; SE grammar), {to'o'e}…{toi} (more general attachment or application to an unspecified component or point in text), {pe'oi} (flexible grammar interpretation).
      notci: |
        {co'ai} but as SE rather than COhAI ({co'ai} is like a FA, which is also sticky); {co'au} affects the attached tanru and picks the left rather than the right tanru unit for the place structure basis, meaning the seltau without {co}, and the tertau with {co}, overriding {co}'s normal place structure basis described in CLL 5.8 where sumti to the right (but not left) are not filled into the normal selbri but to the right tanru unit which is the seltau when {co} is used (note that if a tanru is outside an inner {co'au} selbri, the tanru's place structure basis is used, not necessarily the inner one which happens to have {co'au}).  Because it is SE and not FA, {co'au} affects all sumti, changing the place structure basis for them all, whereas without {co'au}, the presence of {co} only affects sumti to the right of the selbri.  Recommended with experimental grammar feature that allows «SEku» in places other than before a brivla, since then you can say e.g. «carmi cidja co'auku loka titla», allowing «co'auku» to appear after the tanru is already said, when a speaker might possibly want to attach sumti to an already, previously spoken seltau (note that all sumti are affected regardless of the location of {co'au}, so long as it attaches to the bridi used).

        ni'o Under LLG CLL Lojban, by default the tertau is used to select the place structure basis, but if {co} is used, the seltau is (12.2, 5.8).  A second experimental grammar feature would permit «SEnai» to inverse {co'au}.  Just as for {se}, beware that {co'au} actually attaches to the tanru, e.g. as in «co'auke broda brode» rather than «co'au broda brode», just as for «seke broda brode» (as in «broda se brode»).  «co'au» focuses ‘in’ on the left tanru unit, and «co'au» pops back out; composed together they are an identity SE; but you cannot e.g. say «co'aunai co'au» to go to the left with «co'au» and then go to the right with «co'aunai», since «co'aunai» does not go to the right but pops back out as an inverse, so you cannot go ‘left, right, left’, since only the left units of a tanru tree are accessible with «co'au» alone, not branches from a right node (note that «co'au» starts at the outermost level in case «co'au»'s applied-to tanru is a nested «co», whereas «co'ai» is perhaps better thought of as starting from the current place structure basis, i.e. from the innermost level; this happens to mean that «co'auku» can be convenient for skipping all levels of «co», which would require multiple applications of «co'ai»).

        ni'o However, a third experimental grammar feature permits using {bo} to apply SE to {co'au} (otherwise «seco'au» would mean a composition of SE: perform «se» to «co'au broda», i.e. perform «co'au» and then «se»; but «seboco'au» is a single SE operation/function, meaning it's the right branch/tanru unit rather than left), although given the complexity of managing multiple levels of tanru, this feature might be rarely used (see also {do'e} and {pe'oi}).

        ni'o A couple practical conveniences affecting choice of «co'auku» vs «co'ai» is that «co'auku» is only needed once for a nested «co», whereas «co'ai» may be easier if you want to start from the inner bridi and are already mentally primed to start from it, and secondly «co'auku» also affects x1 and sumti to the left of the selbri whereas «co'ai» doesn't (when not placed at the beginning), useful e.g. in «ko'a cu co'auku lakne co du zo zasti» (‘it's likely ‘there is’’), where {ko'a} fills «du» with «co'au», but with «co'ai zo zasti» ko'a would fill x1.  «co'auku» and «co'ai» both work without «co», still selecting the left tanru unit rather than the right.

        ni'o See also {co'e'o} (merges the seltau and tertau place structures; SE grammar), {co'ai} (like FA that applies to the remaining attached sumti; perhaps it could even be FA), {se'o'e} (SE grammar), {do'o'e} (indicates the place structure is vague/elliptical; SE grammar), {to'o'e}…{toi} (more general attachment or application to an unspecified component or point in text), {pe'oi} (flexible grammar interpretation).
      smuvelckivla: left unit;use left tanru unit as place structure basis
    - co'e'o: indicate that the seltau can also modify the tertau's place.
      selma'o: SE
      notci: "This allows tanru to produce a merged place structure more flexibly and freely.  See also: {co'au} (flip tanru place structure basis between tertau and seltau; SE grammar), {co'ai} (new grammar to apply to the remaining attached sumti), {do'e'e} (‘sticky’ {co'e'o} with a more complicated grammar)."
      vlakra: .e'u zo co joi zo fenso
      smuvelckivla: merged tanru place structure
    - slabu (to mo'u datnyvi'u toi):
        co'ai: attach remaining attached sumti to the seltau rather than the tertau.
        selma'o: COhAI
        notci: "Repeatable, and invertible with {nai}.  Based on lamisotanis's earlier definition, but this one has been adapted to add an experimental cmavo without otherwise contradicting the LLG CLL.  See also: {co'au} (SE grammar rather than COhAI grammar)."
    - lilctile: $x_1=c_1=l_1$ is petrol/gasoline/diesel for powering $x_2=l_2$ from source $x_3=c_2$, of grade $x_4$ with additives $x_5$.
      smuvelckivla: petrol;fuel, gasoline;fuel, gas;fuel, diesel;fuel
      notci: See also {ma'erlivla} (more general), {likrtcigaso} (synonym), {tcigaso} (synonym).
    - ma'erlivla: $x_1=l_1$ is a fuel/energy-source for powering vehicle/mode of transport $x_2=l_2=m_1$ carrying $x_3=m_2$ in/on surface/medium $x_4=m_3$, propelled by $x_5=m_4$.
      notci: "See also: {lilctile} (gas)."
      smuvelckivla: fuel;vehicular
    - inda: $x_1$ deserves / merits / is worthy of $x_2$ (property of $x_1$) according to / by standard $x_3$.
      notci: "See also: {pairjerna}, {jerna}.  Based on Ilmen's earlier definition, with an extra {ma'i} place to allow for subjective judgements (objective claims can still be made by representing ‘the objective’ (e.g. «lo fatci») in $x_3$) (e.g. private economic actors may consider goods' worthiness differently by their freedom of choice, and cultures can vary in values)."
      smuvelckivla: deserve;be worthy of, merit;deserve, worthy;deserve
    - pairjerna: $x_1=j_1$ deserves / merits / is worthy of $x_2=j_2=p_2$ [reward/punishment/response] (not necessarily realized) for good/deed/status $x_3=j_3=p_2$ according to / by standard $x_4=p_1$.
      notci: "See also: {inda}."
      smuvelckivla: deserve;fitting reward, merit;fitting reward, worthy of;fitting reward
    - splurtakni'yxau: $x_1=xa_1=s_1$ is magnificent/brilliant to $x_2=xa_2=s_2$ by standard $x_3=xa_3=s_3$.
      smuvelckivla: magnificent;brilliant
      notci: One option of many synonyms.
    - dibyxautce: $x_1=m_1=xa_1=d_1$ is excellent / very high-quality / very splendid / superb to $x_2=xa_2=d_2$, toward $x_3=m_3$ extreme/direction, by standard $x_4=xa_3$.
      notci: "See also: {splurtakni'yxau}."
