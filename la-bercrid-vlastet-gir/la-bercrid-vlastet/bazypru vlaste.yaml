    - "pli'aje: jvaiso bangu":
        - valsi: bangejebo'iso
          mifra: jbo
          bangu cmene: Lojban
          notci: {{notci ziljmina}}
        - valsi: bangejebo
          mifra: jbo
          bangu cmene: Lojban
