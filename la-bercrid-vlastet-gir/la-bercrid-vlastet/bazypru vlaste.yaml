    - reltcinysumtcita: $x_1=tcit_1=s_3$ is a tense (PU, etc.) of/based on/derived from $x_2=tcit_3=tcin_1$ (e.g. «se cabna» ({se} used for tense (see CLL 10.23)) relative to $x_3$ (default) (e.g. «mi» or the bridi) for sumti $x_4=tcit_2=s_1$ of selbri $x_5=s_2$.
      notci: "$x_3$ is essentially the default tense object when it is {zo'u'i}, which CLL specifies is generally the speaker / ‘me’ (e.g. the $x_1$ of «se purci» for «pu broda»), but can refer to the bridi (e.g. «mi pu'o broda»), perhaps creating a ‘higher bridi’ in relation to the ‘inner’ bridi of «mi broda», or alternatively modifying it to refer to the time interval before (the time interval that is «purci») «mi broda» (note, however, that «mi broda pu'o lonu brode» means that you broda  until  brode, so under this interpretation there is an assymetry (by $x_3$) between «mi pu'o broda» ＝ «mi broda pu'oku» ＝ «mi broda pu'ozo'u'i», and «mi broda pu'o ko'a», which means ‘I broda until it’, like «mi broda pu'ozo'u'au».  {zo'e} can be {zo'u'i} (default) as a hint, but {zo'e} can also represent an arbitrary sumti; {zo'u'au} is generally {zo'e} except non-default, so here «mi broda pu'ozo'u'au» means «mi broda pu'o ko'a» and such like.).  Suggestion: given the traditional use of e.g. «caku», «caku» can be understood to mean «cazo'eku» that especially means «cazo'u'iku» given this context but technically can also mean «cazo'u'au» or «cako'a»; «cazo'u'iku» is a more explicit «caku», as is «ca[tu'a]mi». See also: {zo'u'i} (default sumti), {zo'u'au} (non-default sumti), {pavtcinysumtcita} (modal), {tcinysumtcita} (modal/tense), {na'onreltcinysumtcita}."
      smuvelckivla: tense;sumtcita
    - multcu: |
        na'onreltcinysumtcita: $x_1=tcit_1=s_3$ is a normal tense (PU, etc.) of/based on/derived from $x_2=tcit_3=tcin_1$ (e.g. «se cabna» ({se} used for tense (see CLL 10.23)) for sumti $x_3=tcit_2=s_1$ of selbri $x_4=s_2$.
        notci: "See also: {purnci'o}, {reltcinysumtcita}, {nalna'oreltcinysumtcita}."
        smuvelckivla: normal tense;sumtcita
    - multcu: |
        nalna'oreltcinysumtcita: $x_1=tcit_1=s_3$ is an atypical tense (PU, etc.) of/based on/derived from $x_2=tcit_3=tcin_1$ (e.g. «se cabna» ({se} used for tense (see CLL 10.23)) for sumti $x_3=tcit_2=s_1$ of selbri $x_4=s_2$.
        notci: "See also: {purnci'o}, {reltcinysumtcita}, {na'onreltcinysumtcita}."
        smuvelckivla: atypical tense;sumtcita
