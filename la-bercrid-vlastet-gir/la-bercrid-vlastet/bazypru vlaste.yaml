      notci: |
        This is based on and intended to improve rlpowell's previous definition: farna_1 is the direction of, not the direction toward, farna_2, i.e. farna_2 is toward farna_1.  The pointer is toward the thing pointed at; it isn't necessarily the direction of the pointed at thing itself.  This definition removes the confusion of or ambiguity between ‘direction of’ with ‘direction toward’.  To better preserve the original definition, a redundant direction place is added as $x_4$.  See also: {klafa'a} (direction toward, rather than direction of / facing).

