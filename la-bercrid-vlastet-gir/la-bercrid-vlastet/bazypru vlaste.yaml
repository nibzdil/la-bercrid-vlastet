      stuzi smuvelckivla: constructor;maker out of parts
      notci: "See also: {jonzba} (compose), {krapagzbafa'e} (deconstruct), {selgumgau} (combine)."
    - krapagzbafa'e: $x_1=z_1$ deconstructs $x_2=z_2=p_2=k_2$ into parts $x_3=z_3=p_1=k_1$.
