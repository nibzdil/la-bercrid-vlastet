    - zoi'oi: nestable zoi; foreign quote that can be nested.
      notci: "Like {zoi}, except if, for «zoi'oi X», «zoi'oi X» is again found in the foreign quote, then two rather than one more Xs need to be found to close the quote.  {zoi'oi} looks for a nested {zoi'oi} with the same delimiter, and accepts it if it has a pause before it.  That is the only additional control {zoi'oi} takes over the inner text, but otherwise it is allowed to be freeform like for {zoi}.  For consistency, users may opt to always use {zoi'oi} with a pause before it, as in «.zoi'oi», although it's not neceessary at the outer level.  A quick, general technique to remember for nestable foreign quotes is to start it with «.zoi'oifa'o.» and end it with «.fa'o.», although the delimiter can be personalized as well.  An alternative, general delimiter is «zy.», if the possible presence of «zy.» in the text is not an issue, is also available.  Otherwise, a longer alternative general delimiter also is «zoi'oi'a'o» (from {zoi'oi} and {fa'o} or {fanmo}).  Additionally, selecting a lerfu to represent the language of the inner text can also be a common pattern.  {zoi'oi} is like Haskell's nestable multi-line comments.  See also: {zoi}, {zoi'oi'au} (unnestable {zoi}), {zoi'o}."
      smuvelckivla: nestable zoi;nestable foreign quote, zoi;nestable foreign quote
    - zoi'oi'au: unnestable zoi; foreign quote that cannot be nested.
      notci: "Currently this is a duplicate of {zoi}.  However, by allocating a word that specifically precludes nestability, if the grammar is ever updated, or if a dialect is chosen that modifies {zoi} to be {zoi'oi}, then {zoi'oi'au} allows access to old-style {zoi}.  See also: {zoi'oi} (nestable {zoi})."
      smuvelckivla: unnestable zoi;unnestable foreign quote
      vlakra: zo zoi'oi joi zo claxu
