    - jajyjai: $x_1=jg_1$ grabs $x_2=jg_2=jm_1$ towards $x_3=jm_3$ away from $x_4=jm_4$ with $x_5=jg_3$ (part of $x_1$) at locus $x_6=jg_4$ (part of $x_2$).
